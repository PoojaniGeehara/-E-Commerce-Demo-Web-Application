<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Order Confirmed - ShopEase</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/navbar.css">
  <link rel="stylesheet" href="../css/checkout.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body data-page="cart">

  <header class="navbar">
    <div class="navbar-inner">
      <a href="../index.html" class="navbar-logo"><span class="logo-mark">SE</span>ShopEase</a>
      <button class="navbar-toggle" aria-label="Toggle menu" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
      <nav class="navbar-links">
        <a href="../index.html" data-page="home">Home</a>
        <a href="products.html" data-page="products">Products</a>
        <a href="../index.html#categories" data-page="categories">Categories</a>
        <a href="cart.html" data-page="cart" data-cart-count>Cart (0)</a>
        <a href="login.html" data-nav="guest-only" data-page="login" class="btn btn-secondary">Login</a>
        <a href="profile.html" data-nav="auth-only" data-page="profile" style="display:none;">Profile</a>
        <a href="#" data-nav="auth-only" data-action="logout" style="display:none;">Logout</a>
      </nav>
    </div>
  </header>

  <main>
    <div class="container">
      <div class="order-success-wrapper card">
        <div class="order-success-icon">&#10003;</div>
        <h1>Order Placed Successfully!</h1>
        <p class="text-muted">Thank you for shopping with ShopEase. Your order <strong id="order-number-value"></strong> has been received.</p>

        <div class="order-details-list" id="order-success-details"></div>

        <a href="products.html" class="btn btn-primary btn-block">Continue Shopping</a>
      </div>
    </div>
  </main>

  <footer>
    <div class="container">
      <div class="footer-bottom">
        &copy; <span data-current-year></span> ShopEase. Demo application for SQA testing purposes only.
      </div>
    </div>
  </footer>

  <script src="../data/products.js"></script>
  <script src="../js/main.js"></script>
  <script src="../js/cart.js"></script>
  <script src="../js/checkout.js"></script>
</body>
</html>
