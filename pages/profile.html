<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Profile - ShopEase</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/navbar.css">
  <link rel="stylesheet" href="../css/forms.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body data-page="profile">

  <header class="navbar">
    <div class="navbar-inner">
      <a href="../index.html" class="navbar-logo"><span class="logo-mark">SE</span>ShopEase</a>
      <button class="navbar-toggle" aria-label="Toggle menu" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
      <nav class="navbar-links">
        <a href="../index.html" data-page="home">Home</a>
        <a href="products.html" data-page="products">Products</a>
        <a href="../index.html#categories" data-page="categories">Categories</a>
        <a href="cart.html" data-page="cart" data-cart-count>Cart (0)</a>
        <a href="login.html" data-nav="guest-only" data-page="login" class="btn btn-secondary">Login</a>
        <a href="profile.html" data-nav="auth-only" data-page="profile" style="display:none;">Profile</a>
        <a href="#" data-nav="auth-only" data-action="logout" style="display:none;">Logout</a>
      </nav>
    </div>
  </header>

  <main>
    <div class="page-header">
      <div class="container">
        <h1>My Profile</h1>
        <p class="text-muted">View and update your account details.</p>
      </div>
    </div>

    <div class="container" style="max-width:640px; padding-top:32px; padding-bottom:64px;" id="profile-container">
      <div class="alert" id="profile-alert"></div>

      <div class="card" style="padding:32px;" id="profile-view">
        <div class="form-group">
          <label>Full Name</label>
          <p id="profile-name" style="font-size:1.05rem;"></p>
        </div>
        <div class="form-group">
          <label>Email</label>
          <p id="profile-email" style="font-size:1.05rem;"></p>
        </div>
        <div class="form-group">
          <label>Phone</label>
          <p id="profile-phone" style="font-size:1.05rem;"></p>
        </div>
        <div class="form-group">
          <label>Address</label>
          <p id="profile-address" style="font-size:1.05rem;"></p>
        </div>

        <div style="display:flex; gap:12px; margin-top:12px;">
          <button type="button" class="btn btn-primary" id="edit-profile-btn">Edit Profile</button>
          <button type="button" class="btn btn-danger-outline" data-action="logout">Logout</button>
        </div>
      </div>

      <form class="card" style="padding:32px; display:none;" id="profile-edit-form">
        <h2 style="font-size:1.15rem; margin-bottom:18px;">Edit Profile</h2>

        <div class="form-group">
          <label for="edit-name">Full Name</label>
          <input type="text" id="edit-name" name="fullName">
          <span class="field-error" id="edit-name-error"></span>
        </div>

        <div class="form-group">
          <label for="edit-phone">Phone</label>
          <input type="tel" id="edit-phone" name="phone">
          <span class="field-error" id="edit-phone-error"></span>
        </div>

        <div class="form-group">
          <label for="edit-address">Address</label>
          <input type="text" id="edit-address" name="address">
        </div>

        <div style="display:flex; gap:12px;">
          <button type="submit" class="btn btn-primary">Save Changes</button>
          <button type="button" class="btn btn-outline" id="cancel-edit-btn">Cancel</button>
        </div>
      </form>
    </div>
  </main>

  <footer>
    <div class="container">
      <div class="footer-bottom">
        &copy; <span data-current-year></span> ShopEase. Demo application for SQA testing purposes only.
      </div>
    </div>
  </footer>

  <script src="../data/products.js"></script>
  <script src="../js/main.js"></script>
  <script src="../js/cart.js"></script>
  <script src="../js/validation.js"></script>
  <script src="../js/profile.js"></script>
</body>
</html>
