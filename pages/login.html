<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - ShopEase</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/navbar.css">
  <link rel="stylesheet" href="../css/forms.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body data-page="login">

  <header class="navbar">
    <div class="navbar-inner">
      <a href="../index.html" class="navbar-logo"><span class="logo-mark">SE</span>ShopEase</a>
      <button class="navbar-toggle" aria-label="Toggle menu" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
      <nav class="navbar-links">
        <a href="../index.html" data-page="home">Home</a>
        <a href="products.html" data-page="products">Products</a>
        <a href="../index.html#categories" data-page="categories">Categories</a>
        <a href="cart.html" data-page="cart" data-cart-count>Cart (0)</a>
        <a href="login.html" data-nav="guest-only" data-page="login" class="btn btn-secondary">Login</a>
        <a href="profile.html" data-nav="auth-only" data-page="profile" style="display:none;">Profile</a>
        <a href="#" data-nav="auth-only" data-action="logout" style="display:none;">Logout</a>
      </nav>
    </div>
  </header>

  <main>
    <div class="auth-wrapper">
      <div class="auth-card card">
        <h1>Welcome back</h1>
        <p class="auth-subtitle">Log in to your ShopEase account.</p>

        <div class="demo-hint">
          Demo credentials &mdash; Email: <strong>demo@example.com</strong> &nbsp;|&nbsp; Password: <strong>Password123</strong>
        </div>

        <div class="alert" id="login-alert"></div>

        <form id="login-form" novalidate>
          <div class="form-group">
            <label for="login-email">Email</label>
            <input type="email" id="login-email" name="email" autocomplete="email">
            <span class="field-error" id="login-email-error"></span>
          </div>

          <div class="form-group">
            <label for="login-password">Password</label>
            <input type="password" id="login-password" name="password" autocomplete="current-password">
            <span class="field-error" id="login-password-error"></span>
          </div>

          <div class="form-group checkbox-row">
            <input type="checkbox" id="login-remember" name="remember">
            <label for="login-remember" style="margin:0; font-weight:400;">Remember Me</label>
          </div>

          <button type="submit" class="btn btn-primary btn-block">Login</button>
        </form>

        <div class="auth-footer">
          Don't have an account? <a href="register.html">Create Account</a>
        </div>
      </div>
    </div>
  </main>

  <footer>
    <div class="container">
      <div class="footer-bottom">
        &copy; <span data-current-year></span> ShopEase. Demo application for SQA testing purposes only.
      </div>
    </div>
  </footer>

  <script src="../data/products.js"></script>
  <script src="../js/main.js"></script>
  <script src="../js/cart.js"></script>
  <script src="../js/validation.js"></script>
  <script src="../js/auth.js"></script>
</body>
</html>
